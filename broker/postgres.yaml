apiVersion: apps/v1
kind: Deployment
metadata:
 labels:
    component: postgres
 name: postgres
spec:
 replicas: 1
 selector:
  matchLabels:
    component: postgres
 strategy: {}
 template:
  metadata:
    labels:
     component: postgres
  spec:
    containers:
    - env:
      - name: POSTGRES_DB
        value: ngb
      # Credentials come from the scorpio-db Secret (see README); Scorpio reads the same Secret
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: scorpio-db
            key: password
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: scorpio-db
            key: user
      image: mdillon/postgis
      imagePullPolicy: ""
      name: postgres
      ports:
      - containerPort: 5432
      resources: {}
      volumeMounts:
      - mountPath: /var/lib/postgresql/data
        name: postgredb
    restartPolicy: Always
    serviceAccountName: ""
    volumes:
      - name: postgredb
        persistentVolumeClaim:
          claimName: postgres-pv-claim
status: {}