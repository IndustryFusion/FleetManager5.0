apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
      component: scorpio
  name: scorpio
spec:
  replicas: 1
  selector:
    matchLabels:
      component: scorpio
  strategy: {}
  template:
    metadata:
      labels:
        component: scorpio
    spec:
      containers:
      - image: scorpiobroker/all-in-one-runner:java-kafka-latest
        imagePullPolicy: ""
        name: scorpio
        # Same database credentials as broker/postgres.yaml, from the scorpio-db Secret (see README)
        env:
        - name: DBUSER
          valueFrom:
            secretKeyRef:
              name: scorpio-db
              key: user
        - name: DBPASS
          valueFrom:
            secretKeyRef:
              name: scorpio-db
              key: password
        ports:
        - containerPort: 9090
        resources: {}
      restartPolicy: Always
      serviceAccountName: ""
      volumes: null
status: {}